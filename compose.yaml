services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybersec_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:5000"
    environment:
      - DB_HOST=database
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - SECRET_KEY=${SECRET_KEY}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - public_net
      - internal_net

  database:
    image: mysql:8.4
    container_name: cybersec_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - internal_net
    # Port 3306 is isolated internally and NOT published to the host/public.

networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge
    internal: true

volumes:
  db_data:
    driver: local
